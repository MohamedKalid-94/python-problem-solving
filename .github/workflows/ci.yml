name: Python Tests - Phase 1

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"


    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip


    - name: Install Dependencies
      run: |
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi


    - name: Check Python Files
      run: |
        python --version

        find . -name "*.py"


    - name: Run Phase 1 Python Programs
      run: |

        echo "Running Phase 1 - Python Problem Solving"

        echo "Phase 1 Step 1 - Variables"
        python 01_variables/*.py || true

        echo "Phase 1 Step 2 - Input Output"
        python 02_input_output/*.py || true

        echo "Phase 1 Step 3 - Conditional Statements"
        python 03_conditionals/*.py || true

        echo "Phase 1 Step 4 - Loops"
        python 04_loops/*.py || true

        echo "Phase 1 Step 5 - Functions"
        python 05_functions/*.py || true

        echo "Phase 1 Step 6 - Strings"
        python 06_strings/*.py || true

        echo "Phase 1 Step 7 - Collections"
        python 07_collections/*.py || true

        echo "Phase 1 Step 8 - Collections Advanced"
        python 08_collections/*.py || true


    - name: Validate Python Syntax
      run: |
        python -m compileall .